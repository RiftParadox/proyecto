services:
  db:
    image: postgres:16
    container_name: control-biblioteca-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biblioteca}
      POSTGRES_USER: ${POSTGRES_USER:-biblioteca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - biblioteca_data:/var/lib/postgresql/data

volumes:
  biblioteca_data:
